<header class="site-header">
  <div class="site-header-inner">
    <a class="site-title" href="{{ '/' | relative_url }}">{{ site.title }}</a>
    <nav class="site-nav">
      {% assign nav_items = "Publications:/publications/|Teaching:/teaching/|Talks:/talks/|CV:/cv/|Blog:/blog/" | split: "|" %}
      {% for item in nav_items %}
        {% assign parts = item | split: ":" %}
        <a href="{{ parts[1] | relative_url }}"{% if page.url contains parts[1] %} class="active"{% endif %}>{{ parts[0] }}</a>
      {% endfor %}
    </nav>
  </div>
</header>
