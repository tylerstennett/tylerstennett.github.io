title: Tyler Stennett
description: >-
  PhD student in Computer Science at the Georgia Institute of Technology.
url: "https://tylerstennett.com"
baseurl: ""

author:
  name: Tyler Stennett
  email: tyler.stennett@gatech.edu

github_username: tylerstennett
scholar_url: "https://scholar.google.com/citations?user=t2rIsdIAAAAJ&hl=en"

# Cloudflare Web Analytics is enabled on production builds when this public
# site token is populated. Keep it blank to disable analytics.
cloudflare_web_analytics:
  token: "62c5b471cbcd4179a971ba19ab03fc8c"

markdown: kramdown
highlighter: rouge
permalink: /news/:year/:title/

plugins:
  - jekyll-seo-tag
  - jekyll-feed
  - jekyll-sitemap

collections:
  research:
    output: true
    permalink: /research/:name/

sass:
  sass_dir: _sass
  style: compressed

defaults:
  - scope:
      path: ""
      type: "posts"
    values:
      layout: post
  - scope:
      path: ""
      type: "research"
    values:
      layout: research-note
  - scope:
      path: ""
    values:
      layout: page

exclude:
  - Gemfile
  - Gemfile.lock
  - README.md
  - CLAUDE.md
  - vendor
  - .bundle
  - assets/img/headshot_square.png # full-res source; the site serves headshot.jpg
