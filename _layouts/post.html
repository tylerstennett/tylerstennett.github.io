---
layout: default
---
<article class="post">
  <h1>{{ page.title }}</h1>
  <p class="post-meta"><time datetime="{{ page.date | date_to_xmlschema }}">{{ page.date | date: "%B %-d, %Y" }}</time></p>
  {{ content }}
  <p class="back-link"><a href="{{ '/news/' | relative_url }}">&larr; All news</a></p>
</article>
